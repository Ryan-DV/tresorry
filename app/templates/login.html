<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Tresorry · Locked</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23f2b84b'/%3E%3Ccircle cx='16' cy='16' r='8' fill='none' stroke='%230a0b0e' stroke-width='3'/%3E%3Ccircle cx='16' cy='16' r='2.5' fill='%230a0b0e'/%3E%3C/svg%3E">
<style nonce="{{ g.nonce }}">
  :root {
    --bg: #08090c; --panel: rgba(20, 22, 28, 0.72); --line: rgba(255,255,255,0.08);
    --text: #ecedf0; --muted: #8d919c; --gold: #f2b84b; --gold-2: #ffd98a; --danger: #ff7a7a;
    --sans: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text); font-family: var(--sans);
    display: grid; place-items: center; overflow: hidden; -webkit-font-smoothing: antialiased;
  }
  .tiles {
    position: fixed; inset: -40px; display: grid; gap: 10px;
    grid-template-columns: repeat(12, 1fr); grid-auto-rows: 1fr; pointer-events: none;
    transform: perspective(900px) rotateX(48deg) scale(1.35) translateY(8%);
    mask-image: radial-gradient(ellipse at center, #000 10%, transparent 70%);
    -webkit-mask-image: radial-gradient(ellipse at center, #000 10%, transparent 70%);
  }
  .tiles span { border: 1px solid rgba(255,255,255,0.05); border-radius: 6px; aspect-ratio: 1; }
  .tiles span.l1 { background: rgba(242,184,75,0.05); }
  .tiles span.l2 { background: rgba(242,184,75,0.12); animation: glow 5s ease-in-out infinite; }
  .tiles span.l3 { background: rgba(242,184,75,0.22); animation: glow 7s ease-in-out infinite 1.5s; }
  @keyframes glow { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }
  .halo {
    position: fixed; width: 900px; height: 900px; border-radius: 50%; pointer-events: none;
    background: radial-gradient(circle, rgba(242,184,75,0.16), transparent 60%); filter: blur(20px);
  }
  main { position: relative; width: min(420px, calc(100vw - 32px)); }
  .card {
    background: var(--panel); border: 1px solid var(--line); border-radius: 22px;
    padding: 36px 32px 28px; backdrop-filter: blur(18px) saturate(140%);
    -webkit-backdrop-filter: blur(18px) saturate(140%);
    box-shadow: 0 30px 80px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.05);
  }
  .mark { width: 52px; height: 52px; margin-bottom: 22px; }
  .dial { transform-origin: 26px 26px; animation: spin 14s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  h1 { margin: 0; font-size: 30px; font-weight: 650; letter-spacing: -0.03em; }
  h1 em { font-style: normal; color: var(--gold); }
  .tag { margin: 6px 0 26px; color: var(--muted); font-size: 14.5px; line-height: 1.5; }
  label { display: block; font-size: 12px; font-family: var(--mono); color: var(--muted);
          letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 8px; }
  .field { position: relative; }
  input[type=password] {
    width: 100%; padding: 14px 16px; font-size: 16px; font-family: var(--mono); color: var(--text);
    background: rgba(0,0,0,0.35); border: 1px solid var(--line); border-radius: 12px; outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  input[type=password]:focus { border-color: rgba(242,184,75,0.6); box-shadow: 0 0 0 4px rgba(242,184,75,0.12); }
  button {
    width: 100%; margin-top: 14px; padding: 14px; font-size: 15px; font-weight: 600; font-family: var(--sans);
    color: #1a1204; background: linear-gradient(180deg, var(--gold-2), var(--gold)); border: 0; border-radius: 12px;
    cursor: pointer; transition: transform .12s, box-shadow .12s, filter .12s;
    box-shadow: 0 8px 24px rgba(242,184,75,0.25);
  }
  button:hover { transform: translateY(-1px); filter: brightness(1.05); box-shadow: 0 12px 30px rgba(242,184,75,0.32); }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
  .err {
    display: flex; gap: 10px; align-items: center; margin: 0 0 16px; padding: 11px 14px; border-radius: 10px;
    background: rgba(255,122,122,0.08); border: 1px solid rgba(255,122,122,0.25); color: var(--danger); font-size: 14px;
    animation: shake .35s ease;
  }
  @keyframes shake { 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
  .foot { margin-top: 18px; display: flex; justify-content: space-between; color: var(--muted); font-size: 12px; font-family: var(--mono); }
  .foot .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--gold); margin-right: 7px; vertical-align: 1px; box-shadow: 0 0 10px var(--gold); }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="halo" aria-hidden="true"></div>
<div class="tiles" aria-hidden="true">{% for t in tiles %}<span class="{{ 'l3' if t == 0 else 'l2' if t < 3 else 'l1' if t < 5 else '' }}"></span>{% endfor %}</div>
<main>
  <form class="card" method="post" action="/login" autocomplete="on">
    <svg class="mark" viewBox="0 0 52 52" aria-hidden="true">
      <rect x="1" y="1" width="50" height="50" rx="14" fill="#15171d" stroke="rgba(255,255,255,0.1)"/>
      <g class="dial" fill="none" stroke="#f2b84b" stroke-width="2.2" stroke-linecap="round">
        <circle cx="26" cy="26" r="13"/>
        <path d="M26 9v4M26 39v4M9 26h4M39 26h4"/>
      </g>
      <circle cx="26" cy="26" r="4" fill="#f2b84b"/>
    </svg>
    <h1>tre<em>sorry</em></h1>
    <p class="tag">Like Tresorit, but it lives under your desk and apologises for nothing.</p>
    {% if error %}<p class="err" role="alert"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v4M12 16h.01"/></svg>{{ error }}</p>{% endif %}
    <label for="pw">Passphrase</label>
    <div class="field">
      <input id="pw" name="password" type="password" autocomplete="current-password" autofocus required
             maxlength="256" spellcheck="false" autocapitalize="off" placeholder="word-word-word-word-00">
    </div>
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit">Unlock the vault</button>
    <div class="foot"><span><span class="dot"></span>TLS · local only</span><span>v1.0</span></div>
  </form>
</main>
</body>
</html>
